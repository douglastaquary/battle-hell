[package]
name = "battle-hell-editor"
version = "0.1.0"
description = "Battle Hell Map Editor (macOS)"
authors = ["Douglas Taquary"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "battle_hell_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
